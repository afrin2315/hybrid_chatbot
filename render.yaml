services:
  - type: web
    name: hybrid-chatbot
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # Render sets $PORT; gunicorn must bind to it. One worker keeps memory low.
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      # Force Python 3.11 — pinned numpy/scikit-learn have no wheels for 3.13/3.14
      # and the committed models were trained with scikit-learn 1.3.2.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      # Set your LLM key in the Render dashboard (do NOT commit it):
      - key: GEMINI_API_KEY
        sync: false
